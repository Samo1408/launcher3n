name: Build Modified APK

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug
        
      - name: Show Dir/s in Source
        run: ls
            mkdir 1
            cd app/build
            mkdir 2
            ls
            
        
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: KISS-Modified-Debug-APK
          path: Launcher3n/app/build/outputs/apk/debug/*.apk
          retention-days: 30
